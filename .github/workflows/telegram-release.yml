name: 发布到 Telegram 群

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本号（留空则取最新正式版）"
        required: false
        default: ""

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 确定版本号
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ -n "$EVENT_TAG" ]; then
            echo "tag=$EVENT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(gh release list --repo "${{ github.repository }}" --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName')" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载发版资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p assets
          gh release download "$TAG" --dir assets --repo "${{ github.repository }}" || echo "no assets to download"
          ls -la assets

      - name: 发到 Telegram 群
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]

          rel = json.loads(subprocess.run(
              ["gh", "release", "view", tag, "--repo", repo,
               "--json", "name,body,url"],
              capture_output=True, text=True, check=True).stdout)
          name = rel.get("name") or tag
          body = (rel.get("body") or "").strip()
          url = rel.get("url") or ""

          text = "HGhubX " + name + " 已发布\n\n"
          if body:
              text += body[:3000] + "\n\n"
          if url:
              text += "下载地址：" + url

          def api(method, data):
              req = urllib.request.Request(
                  "https://api.telegram.org/bot" + token + "/" + method,
                  data=urllib.parse.urlencode(data).encode(), method="POST")
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read())

          sent = api("sendMessage", {"chat_id": chat_id, "text": text})
          print("message sent:", sent.get("ok"),
                sent.get("result", {}).get("message_id"))

          for path in sorted(glob.glob("assets/*")):
              fname = os.path.basename(path)
              size = os.path.getsize(path)
              if size > 50 * 1024 * 1024:
                  print(fname, "-> skipped: over 50 MB Bot API limit")
                  continue
              res = subprocess.run([
                  "curl", "-s", "-X", "POST",
                  "https://api.telegram.org/bot" + token + "/sendDocument",
                  "-F", "chat_id=" + chat_id,
                  "-F", "document=@" + path,
                  "-F", "caption=" + fname,
              ], capture_output=True, text=True, timeout=300)
              try:
                  ok = json.loads(res.stdout).get("ok")
              except Exception:
                  ok = None
              print(fname, "-> sent:", ok)
          PY
