name: TV

# TV 版独立工作流（与 ci.yml 彻底分开）：
# - 日常验收：PR/推送 main 且 TV 相关路径变化时跑 TV acceptance（真实 TV bootstrap/Worker/片库，mock IPC）；
# - 打包发布：v* tag 或手动 mode=package 出 TV APK；tag 触发时等标准版 Release 创建后追加上传 TV 产物。
# 标准版校验/出包/建 Release 在 ci.yml；两条工作流各自产生运行记录，TV 的偶发失败不再拖累标准版。
on:
  pull_request:
    paths:
      - "src/tv/**"
      - "src/shared/**"
      - "src/editionEntry.ts"
      - "src/legacyRuntime.ts"
      - "src/main.tsx"
      - "src/index.css"
      - "src/styles/**"
      - "tests/tv-remote*"
      - "scripts/test-tv-remote.mjs"
      - "scripts/build-android-tv.mjs"
      - "scripts/patch-android-tv.mjs"
      - "src-tauri/tauri.tv.conf.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/tv.yml"
  push:
    branches: [main]
    paths:
      - "src/tv/**"
      - "src/shared/**"
      - "src/editionEntry.ts"
      - "src/legacyRuntime.ts"
      - "src/main.tsx"
      - "src/index.css"
      - "src/styles/**"
      - "tests/tv-remote*"
      - "scripts/test-tv-remote.mjs"
      - "scripts/build-android-tv.mjs"
      - "scripts/patch-android-tv.mjs"
      - "src-tauri/tauri.tv.conf.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/tv.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式：acceptance 只跑 TV 验收；package 出 TV APK（配合 tag 追加到 Release）"
        type: choice
        default: acceptance
        options: [acceptance, package]
      quick:
        description: "快速编译（仅 mode=package 生效）：thin LTO + 4 个 codegen 单元，不编 x86_64"
        type: boolean
        default: true
      tag:
        description: "发版 tag（仅 mode=package 生效，如 v2.2.0）：非空时等该 Release 创建后追加 TV 产物；留空只出 Actions 产物"
        type: string
        default: ""
      prerelease:
        description: "标记为 Pre-release（仅 tag 非空且 Release 尚不存在时生效）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tv-${{ github.ref }}-${{ github.event_name }}-${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.run_id || 'branch' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.tag == '') }}

env:
  CI: "true"

jobs:
  acceptance:
    name: TV acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'acceptance')
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve pre-installed FFmpeg & Chrome
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo find /etc/apt/sources.list.d -maxdepth 1 -type f ! -name 'ubuntu.sources' -delete
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i -E 's|^URIs:.*|URIs: https://mirrors.edge.kernel.org/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          if [ -x /usr/bin/google-chrome ]; then
            BROWSER="/usr/bin/google-chrome"
          else
            pnpm exec playwright-core install --with-deps chromium
            BROWSER="$(node --input-type=module -e "import { chromium } from 'playwright-core'; console.log(chromium.executablePath())")"
          fi
          echo "Using browser: $BROWSER, ffmpeg: $(command -v ffmpeg)"
          echo "BROWSER_EXECUTABLE=$BROWSER" >> "$GITHUB_ENV"
      - name: Run TV acceptance
        run: node scripts/test-tv-remote.mjs
      - name: Upload diagnostics even when a check fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tv-acceptance-diagnostics
          path: test-results/tv-remote/
          retention-days: 7
          if-no-files-found: warn

  package:
    name: Android TV (split per ABI)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'package')
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.quick && 'thin' || 'true' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.quick && '4' || '1' }}
    steps:
      - uses: actions/checkout@v7
      - name: 版本号对齐 tag
        id: ver
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_TAG" ]]; then
            V="${INPUT_TAG#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          node scripts/set-version.mjs "$V"
          CODE="$(node -p "require('./src-tauri/tauri.conf.json').bundle.android.versionCode")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$V  versionCode=$CODE"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          ls "$SDK/ndk"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: android-tv
      - run: pnpm install --frozen-lockfile
      - name: 选择 Android TV 配置
        run: cp src-tauri/tauri.tv.conf.json src-tauri/tauri.android.conf.json
      - name: 生成 Android 工程
        run: pnpm tauri android init --ci
      - name: 编译 APK（按 ABI 分包）
        run: |
          if [ "${{ inputs.quick }}" = "true" ]; then
            TARGETS="aarch64 armv7"
          else
            TARGETS="aarch64 armv7 x86_64"
          fi
          echo "targets: $TARGETS"
          pnpm tauri android build --apk --split-per-abi --target $TARGETS
      - name: 签名 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 ANDROID_KEY_BASE64 secret，无法签名"; exit 1
          fi
          PREFIX="HGhubX-TV"
          KS="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          mkdir -p artifacts
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            out="artifacts/${PREFIX}_${VERSION}_${abi}.apk"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --v4-signing-enabled false \
              --out "$out" "$f"
            "$APKSIGNER" verify --print-certs "$out" | head -3
            found=$((found+1))
          done
          rm -f "$KS"
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 release APK"; exit 1; fi
          AAPT2="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | sort -V | tail -1)"
          for a in artifacts/*.apk; do "$AAPT2" dump badging "$a" | grep -m1 "^package:"; done
          ls -lh artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: android-tv
          path: artifacts/*
          if-no-files-found: error

  release-assets:
    name: Append TV assets to Release
    needs: [package]
    if: >-
      !cancelled() &&
      needs.package.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'package' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          name: android-tv
          path: artifacts
      - name: 等待标准版 Release 创建后追加 TV 产物
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          ls -lh artifacts
          # 标准版 ci.yml 的 release job 先创建 Release；这里轮询等待，最多 45 分钟。
          for i in $(seq 1 90); do
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG 已存在，追加 TV 产物"
              gh release upload "$TAG" artifacts/* --clobber -R "$GITHUB_REPOSITORY"
              exit 0
            fi
            echo "等待 Release $TAG（$i/90）"
            sleep 30
          done
          # 兜底：标准版发布失败/未触发时，TV 独立建 Release，避免产物丢失；正文沿用版本说明文件。
          echo "::warning::等待超时，Release $TAG 不存在，TV 独立创建"
          NOTES="docs/release-notes/${TAG}.md"
          EXTRA=()
          if [ -f "$NOTES" ]; then EXTRA+=(--notes-file "$NOTES"); else EXTRA+=(--generate-notes); fi
          if [ "$PRERELEASE" = "true" ] || [[ "$TAG" == *-* ]]; then EXTRA+=(--prerelease); fi
          gh release create "$TAG" artifacts/* --title "$TAG" "${EXTRA[@]}" -R "$GITHUB_REPOSITORY"
